<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Cadastro - CirculaHub</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!-- fontes externas -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>
        <header class="cabecalho">
            <div class="cabecalho-container">
                <a class="logo" href="index.html">CirculaHub</a>
                <nav aria-label="Navegação principal">
                    <ul class="menu">
                        <li><a href="index.html">Início</a></li>
                        <li><a href="login.html">Login</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <main>
            <section class="formulario-container">
                <h1>Seja um parceiro</h1>
                <p>Cadastre-se para oferecer seus serviços de conserto no CirculaHub.</p>
                <!-- cadastro falso: só leva ao login -->
                <form class="formulario" action="login.html" method="get">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" required>

                    <label for="profissao">Profissão</label>
                    <input type="text" id="profissao" name="profissao" required>

                    <label for="area">Área de atuação</label>
                    <select id="area" name="area" required>
                        <option value="">Selecione</option>
                        <option value="eletrodomesticos">Eletrodomésticos</option>
                        <option value="eletronicos">Eletrônicos</option>
                        <option value="moveis">Móveis</option>
                        <option value="roupas">Roupas</option>
                    </select>

                    <label for="bairro">Bairro/Cidade</label>
                    <input type="text" id="bairro" name="bairro" required>

                    <label for="telefone">Telefone de contato</label>
                    <input type="tel" id="telefone" name="telefone" required>

                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required>

                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" required>

                    <label for="confirmar-senha">Confirmar senha</label>
                    <input type="password" id="confirmar-senha" name="confirmar-senha" required>

                    <button class="botao" type="submit">Cadastrar</button>
                </form>
                <p class="formulario-link">Já é parceiro? <a href="login.html">Entrar</a></p>
            </section>
        </main>

        <footer class="rodape">
            <p>&copy; 2026 CirculaHub</p>
        </footer>
    </body>
</html>
