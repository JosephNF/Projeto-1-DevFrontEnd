<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Login - CirculaHub</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!-- fontes externas -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>
        <header class="cabecalho">
            <div class="cabecalho-container">
                <a class="logo" href="index.html">CirculaHub</a>
                <nav aria-label="Navegação principal">
                    <ul class="menu">
                        <li><a href="index.html">Início</a></li>
                        <li><a href="cadastro.html">Cadastre-se</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <main>
            <section class="formulario-container">
                <h1>Entrar</h1>
                <!-- login falso: só redireciona -->
                <form class="formulario" action="index.html" method="get">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required>

                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" required>

                    <button class="botao" type="submit">Entrar</button>
                </form>
                <p class="formulario-link">Ainda não é parceiro? <a href="cadastro.html">Cadastre-se</a></p>
            </section>
        </main>

        <footer class="rodape">
            <p>&copy; 2026 CirculaHub</p>
        </footer>
    </body>
</html>
